---
- name: Gather all Arista EOS facts
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arista.eos.eos
    ansible_network_cli_ssh_type: paramiko
    ansible_paramiko_look_for_keys: false
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: Gather all facts from the switch
      arista.eos.eos_facts:
        gather_subset:
          - all
        gather_network_resources:
          - all

    - name: Show gathered facts
      ansible.builtin.debug:
        var: ansible_facts

    - name: Publish a compact identity summary for later workflow nodes
      ansible.builtin.set_stats:
        aggregate: true
        data:
          gathered_hosts: "{{ [inventory_hostname] }}"
          config_snapshots: "{{ { inventory_hostname: config_snapshot } }}"
      vars:
        config_snapshot:
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          model: "{{ ansible_net_model | default('unknown') }}"
          serial: "{{ ansible_net_serialnum | default('unknown') }}"
          eos_version: "{{ ansible_net_version | default('unknown') }}"
