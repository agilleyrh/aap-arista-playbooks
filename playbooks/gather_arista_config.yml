---
- name: Gather current Arista switch configuration
  hosts: "{{ target_hosts | default('arista_switches') }}"
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/switch_standards.yml"

  tasks:
    - name: Collect switch state with show commands
      ansible.builtin.include_tasks: tasks/collect_switch_state.yml

    - name: Build a compact snapshot for the AAP workflow
      ansible.builtin.set_fact:
        config_snapshot:
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: "{{ current_hostname }}"
          model: "{{ current_model }}"
          serial: "{{ current_serial }}"
          eos_version: "{{ current_eos_version }}"
          lldp_enabled: "{{ current_lldp_enabled }}"
          ntp_servers: "{{ current_ntp }}"
          vlans: "{{ current_vlans }}"
          logging_hosts: "{{ current_logging }}"
          lldp_neighbors: "{{ current_lldp | ansible.utils.json_query('[].{port: port, neighbor_device: neighborDevice}') }}"
          collected_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Show current config summary
      ansible.builtin.debug:
        msg:
          hostname: "{{ config_snapshot.hostname }}"
          model: "{{ config_snapshot.model }}"
          eos_version: "{{ config_snapshot.eos_version }}"
          ntp_servers: "{{ config_snapshot.ntp_servers }}"
          vlans: "{{ config_snapshot.vlans }}"
          lldp_neighbors: "{{ config_snapshot.lldp_neighbors }}"

    - name: Publish snapshot for later workflow nodes
      ansible.builtin.set_stats:
        aggregate: true
        data:
          config_snapshots: "{{ { inventory_hostname: config_snapshot } }}"
