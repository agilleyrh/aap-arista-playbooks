---
- name: Validate Arista switches against standards
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arista.eos.eos
    ansible_network_cli_ssh_type: paramiko
    ansible_paramiko_look_for_keys: false
    ansible_become: true
    ansible_become_method: enable
    ansible_user: "{{ lookup('env', 'ANSIBLE_NET_USERNAME') | default('admin', true) }}"
    ansible_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"
    ansible_become_password: "{{ lookup('env', 'ANSIBLE_NET_AUTH_PASS') | default(lookup('env', 'ANSIBLE_NET_PASSWORD'), true) }}"
    min_eos_version: "4.28.0"
    required_ntp_servers:
      - 192.0.2.10
      - 192.0.2.11
    required_vlans:
      - 20
      - 100
    required_logging_hosts:
      - 192.0.2.20

  tasks:
    - name: Gather all facts from the switch
      arista.eos.eos_facts:
        gather_subset:
          - all
        gather_network_resources:
          - all

    - name: Check minimum EOS version
      ansible.builtin.assert:
        that:
          - (ansible_net_version | regex_search('^[0-9]+(\\.[0-9]+)*')) is version(min_eos_version, '>=')
        fail_msg: "{{ inventory_hostname }} EOS {{ ansible_net_version }} is below {{ min_eos_version }}"
        success_msg: "{{ inventory_hostname }} EOS {{ ansible_net_version }} meets {{ min_eos_version }}"

    - name: Check required NTP servers
      ansible.builtin.assert:
        that:
          - (required_ntp_servers | difference(current_ntp) | length) == 0
        fail_msg: "{{ inventory_hostname }} missing NTP servers {{ required_ntp_servers | difference(current_ntp) }}"
        success_msg: "{{ inventory_hostname }} has required NTP servers"
      vars:
        current_ntp: "{{ (ansible_network_resources.ntp_global | default({'servers': []})).servers | map(attribute='server') | list }}"

    - name: Check required VLANs
      ansible.builtin.assert:
        that:
          - (required_vlans | map('string') | list | difference(current_vlans | map('string') | list) | length) == 0
        fail_msg: "{{ inventory_hostname }} missing VLANs {{ required_vlans | map('string') | list | difference(current_vlans | map('string') | list) }}"
        success_msg: "{{ inventory_hostname }} has required VLANs"
      vars:
        current_vlans: "{{ ansible_network_resources.vlans | default([]) | map(attribute='vlan_id') | list }}"

    - name: Check required logging hosts
      ansible.builtin.assert:
        that:
          - (required_logging_hosts | difference(current_logging) | length) == 0
        fail_msg: "{{ inventory_hostname }} missing logging hosts {{ required_logging_hosts | difference(current_logging) }}"
        success_msg: "{{ inventory_hostname }} has required logging hosts"
      vars:
        current_logging: "{{ (ansible_network_resources.logging_global | default({'hosts': []})).hosts | map(attribute='host') | list }}"

    - name: Publish compliance result for later workflow nodes
      ansible.builtin.set_stats:
        aggregate: true
        data:
          compliance_reports: "{{ { inventory_hostname: compliance_report } }}"
      vars:
        compliance_report:
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          model: "{{ ansible_net_model | default('unknown') }}"
          eos_version: "{{ ansible_net_version | default('unknown') }}"
          passed: true
