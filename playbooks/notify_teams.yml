---
- name: Notify Microsoft Teams with Arista results
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Require a Teams webhook from the AAP credential
      ansible.builtin.assert:
        that:
          - teams_webhook_url is defined
          - teams_webhook_url | length > 0
        fail_msg: Attach a Microsoft Teams Webhook credential to this job template.

    - name: Post summary to Microsoft Teams
      ansible.builtin.uri:
        url: "{{ teams_webhook_url }}"
        method: POST
        headers:
          Content-Type: application/json
        body:
          type: message
          attachments:
            - contentType: application/vnd.microsoft.card.adaptive
              content:
                "$schema": http://adaptivecards.io/schemas/adaptive-card.json
                type: AdaptiveCard
                version: "1.4"
                body:
                  - type: TextBlock
                    size: Large
                    weight: Bolder
                    text: Arista switch job
                  - type: FactSet
                    facts:
                      - title: Switches
                        value: "{{ (config_snapshots | default({})).keys() | list | join(', ') | default('none', true) }}"
                      - title: Models
                        value: "{{ (config_snapshots | default({})).values() | map(attribute='model') | list | join(', ') | default('n/a', true) }}"
                      - title: EOS
                        value: "{{ (config_snapshots | default({})).values() | map(attribute='eos_version') | list | join(', ') | default('n/a', true) }}"
        body_format: json
        status_code:
          - 200
          - 202
      no_log: true
