---
# Shared collection used by gather and validate.
# Use show commands instead of eos_facts. Resource-module fact gathering
# parses running-config (including BGP) and fails on EOS "wait-install".

- name: Collect JSON show commands
  arista.eos.eos_command:
    commands:
      - command: show version
        output: json
      - command: show hostname
        output: json
      - command: show lldp neighbors
        output: json
      - command: show vlan
        output: json
      - command: show interfaces status
        output: json
      - command: show mac address-table
        output: json
  register: arista_json

- name: Collect text config snippets
  arista.eos.eos_command:
    commands:
      - show running-config | include ntp server
      - show running-config | include logging host
      - show running-config | include lldp
      - show banner motd
  register: arista_text

- name: Normalize collected switch state
  ansible.builtin.set_fact:
    current_hostname: "{{ arista_json.stdout[1].hostname | default(arista_json.stdout[1].fqdn | default(inventory_hostname)) }}"
    current_model: "{{ arista_json.stdout[0].modelName | default('unknown') }}"
    current_serial: "{{ arista_json.stdout[0].serialNumber | default('unknown') }}"
    current_eos_version: "{{ arista_json.stdout[0].version | default('0.0.0') }}"
    current_eos_numeric: "{{ (arista_json.stdout[0].version | default('0.0.0')) | regex_search('^[0-9]+(\\.[0-9]+)*') }}"
    current_lldp: "{{ arista_json.stdout[2].lldpNeighbors | default([]) }}"
    current_vlans: "{{ arista_json.stdout[3].vlans | default({}) | dict2items | map(attribute='key') | list }}"
    current_intf_status: "{{ arista_json.stdout[4].interfaceStatuses | default({}) }}"
    current_macs: "{{ arista_json.stdout[5].unicastTable.tableEntries | default(arista_json.stdout[5].unicastUnicastEntries | default([])) }}"
    current_ntp: "{{ arista_text.stdout[0].split('\n') | select('match', 'ntp server') | map('regex_replace', '^.*ntp server\\s+', '') | map('regex_replace', '\\s.*$', '') | list }}"
    current_logging: "{{ arista_text.stdout[1].split('\n') | select('match', 'logging host') | map('regex_replace', '^.*logging host\\s+', '') | map('regex_replace', '\\s.*$', '') | list }}"
    current_lldp_enabled: "{{ 'lldp run' in arista_text.stdout[2] }}"
    current_motd: "{{ arista_text.stdout[3] | default('') }}"
    current_l2: []
