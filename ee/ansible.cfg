# ansible-builder Galaxy config for Red Hat certified content.
# Supply an Automation Hub offline token at build time:
#   ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN

[galaxy]
server_list = automation_hub_certified

[galaxy_server.automation_hub_certified]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
