---
# Create AAP project, job templates, and workflow.
# Inventory and Network credentials come from AAP, not this repo.
# Run on the supported EE, which already includes ansible.controller.

- name: Bootstrap AAP objects for Arista playbooks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') | default('', true) }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
    controller_validate_certs: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default('true', true) }}"
    aap_organization: Default
    aap_project_name: Arista Switch Playbooks
    aap_project_scm_url: https://github.com/agilleyrh/aap-arista-playbooks.git
    aap_project_scm_branch: main
    aap_inventory_name: Arista Switches
    aap_ee_name: ""
    aap_network_credential: ""
    aap_teams_credential_type: Microsoft Teams Webhook
    aap_teams_credential: ""
    aap_jt_gather: Gather Arista Config
    aap_jt_validate: Validate Switch Standards
    aap_jt_notify: Notify Microsoft Teams
    aap_workflow_name: Arista Baremetal Compliance
  collections:
    - ansible.controller

  tasks:
    - name: Require Controller connection details
      ansible.builtin.assert:
        that:
          - controller_host | length > 0
          - controller_username | length > 0
          - controller_password | length > 0
        fail_msg: Set controller_host, controller_username, and controller_password.

    - name: Create Microsoft Teams webhook credential type
      ansible.controller.credential_type:
        name: "{{ aap_teams_credential_type }}"
        description: Incoming webhook URL for Microsoft Teams / Power Automate
        kind: cloud
        inputs:
          fields:
            - id: webhook_url
              type: string
              label: Webhook URL
              secret: true
          required:
            - webhook_url
        injectors:
          extra_vars:
            teams_webhook_url: "{{ '{{ webhook_url }}' }}"
        state: present

    - name: Create inventory
      ansible.controller.inventory:
        name: "{{ aap_inventory_name }}"
        description: Attach Arista switches here, or choose another inventory at launch
        organization: "{{ aap_organization }}"
        state: present

    - name: Create SCM project
      ansible.controller.project:
        name: "{{ aap_project_name }}"
        description: Flat Arista EOS playbooks
        organization: "{{ aap_organization }}"
        scm_type: git
        scm_url: "{{ aap_project_scm_url }}"
        scm_branch: "{{ aap_project_scm_branch }}"
        scm_update_on_launch: true
        state: present

    - name: Sync project so playbooks exist before job templates reference them
      ansible.controller.project_update:
        name: "{{ aap_project_name }}"
        organization: "{{ aap_organization }}"
        wait: true

    - name: Create Gather Arista Config job template
      ansible.controller.job_template:
        name: "{{ aap_jt_gather }}"
        job_type: run
        organization: "{{ aap_organization }}"
        inventory: "{{ aap_inventory_name }}"
        project: "{{ aap_project_name }}"
        playbook: playbooks/gather_arista_config.yml
        execution_environment: "{{ aap_ee_name if aap_ee_name | length > 0 else omit }}"
        credentials: "{{ [aap_network_credential] if aap_network_credential | length > 0 else omit }}"
        verbosity: 1
        use_fact_cache: false
        ask_inventory_on_launch: true
        ask_credential_on_launch: "{{ aap_network_credential | length == 0 }}"
        state: present

    - name: Create Validate Switch Standards job template
      ansible.controller.job_template:
        name: "{{ aap_jt_validate }}"
        job_type: run
        organization: "{{ aap_organization }}"
        inventory: "{{ aap_inventory_name }}"
        project: "{{ aap_project_name }}"
        playbook: playbooks/validate_switch_standards.yml
        execution_environment: "{{ aap_ee_name if aap_ee_name | length > 0 else omit }}"
        credentials: "{{ [aap_network_credential] if aap_network_credential | length > 0 else omit }}"
        verbosity: 1
        use_fact_cache: false
        ask_inventory_on_launch: true
        ask_credential_on_launch: "{{ aap_network_credential | length == 0 }}"
        state: present

    - name: Create Notify Microsoft Teams job template
      ansible.controller.job_template:
        name: "{{ aap_jt_notify }}"
        job_type: run
        organization: "{{ aap_organization }}"
        inventory: "{{ aap_inventory_name }}"
        project: "{{ aap_project_name }}"
        playbook: playbooks/notify_teams.yml
        execution_environment: "{{ aap_ee_name if aap_ee_name | length > 0 else omit }}"
        credentials: "{{ [aap_teams_credential] if aap_teams_credential | length > 0 else omit }}"
        use_fact_cache: false
        ask_inventory_on_launch: true
        state: present

    - name: Create workflow
      ansible.controller.workflow_job_template:
        name: "{{ aap_workflow_name }}"
        description: Gather Arista facts, validate, always notify Teams
        organization: "{{ aap_organization }}"
        ask_inventory_on_launch: true
        state: present
        destroy_current_nodes: true
        workflow_nodes:
          - identifier: gather
            unified_job_template: "{{ aap_jt_gather }}"
            related:
              success_nodes:
                - identifier: validate
          - identifier: validate
            unified_job_template: "{{ aap_jt_validate }}"
            related:
              always_nodes:
                - identifier: notify
          - identifier: notify
            unified_job_template: "{{ aap_jt_notify }}"
            all_parents_must_converge: true
