---
# Org-wide switch standards. Override with AAP extra vars or inventory vars.
switch_standards:
  min_eos_version: "4.28.0"
  hostname_pattern: "^(leaf|spine|border)-[0-9]{2}\\."
  lldp_enabled: true
  ntp_servers:
    - 192.0.2.10
    - 192.0.2.11
  logging_hosts:
    - 192.0.2.20
  required_vlans:
    - 1
    - 20
    - 100
  require_interface_description: true
  require_motd_banner: true

compliance_fail_on_violation: true
